
<button id="upd" hidden>Update ready · tap to reload</button>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const show=w=>{const b=document.getElementById('upd');b.hidden=false;b.onclick=()=>w.postMessage('go')};
    if(reg.waiting&&navigator.serviceWorker.controller)show(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)show(w)})});
    setInterval(()=>reg.update(),30*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update()});
  }).catch(()=>{});
  let r=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!r){r=true;location.reload()}});
}
</script>
</body></html>
